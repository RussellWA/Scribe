name: Build and Release Scribe

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: Scribe-Windows.zip
            path: build/bin/Scribe.exe # Adjust if your binary name is different
          - os: macos-latest
            asset_name: Scribe-macOS.zip
            path: build/bin/Scribe.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"  
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Wails App
        run: wails build

      # Zip the build output so it's clean for users to download
      - name: Compress Windows Build
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path build/bin/* -DestinationPath Scribe-Windows.zip

      - name: Compress macOS Build
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r ../../Scribe-macOS.zip Scribe.app

      # This creates the GitHub Release and attaches the zip files automatically!
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Scribe-Windows.zip
            Scribe-macOS.zip
          draft: false
          prerelease: false